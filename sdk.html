<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>T5 SDK host</title>
</head>
<body>
<h1>idOS SDK host — T5 origin test</h1>
<p id="org"></p>
<label>Test wallet private key: <input id="pk" type="password" size="70"></label>
<button id="go">Init + LogIn</button>
<pre id="log" style="white-space:pre-wrap;border:1px solid #999;padding:8px;min-height:120px"></pre>
<div id="idOS-enclave" style="width:460px;height:620px;border:2px solid #333"></div>
<script type="module">
const logEl = document.getElementById('log');
function log(...a) {
  const s = a.map(x => {
    try { return typeof x === 'string' ? x : ((x && x.message) || JSON.stringify(x)); }
    catch { return String(x); }
  }).join(' ');
  logEl.textContent += s + '\n';
}
document.getElementById('org').textContent = 'This page origin: ' + location.origin;
let clientMod = null, ethersMod = null;
async function loadSdk() {
  if (!clientMod) {
    log('loading SDK modules from esm.sh ...');
    clientMod = await import('https://esm.sh/@idos-network/client@5.0.0');
    ethersMod = await import('https://esm.sh/ethers@6.13.0');
    log('SDK modules loaded');
  }
}
async function doLogin() {
  try {
    await loadSdk();
    const pk = document.getElementById('pk').value.trim();
    if (!pk) { log('no private key entered'); return; }
    const { idOSClientConfiguration } = clientMod;
    const { Wallet } = ethersMod;
    const config = new idOSClientConfiguration({
      nodeUrl: 'https://nodes.playground.idos.network',
      enclaveOptions: { container: '#idOS-enclave', url: 'https://enclave.playground.idos.network' }
    });
    const client = await config.createClient();
    const signer = new Wallet(pk);
    log('signer address:', signer.address);
    const withSigner = await client.withUserSigner(signer);
    log('hasProfile:', String(await withSigner.hasProfile()));
    log('calling logIn() - watch the enclave frame for a prompt');
    const loggedIn = await withSigner.logIn();
    log('LOGIN SUCCESS');
    try {
      const creds = await loggedIn.data.listCredentials();
      log('listCredentials count:', String(creds.length));
    } catch (e) { log('listCredentials note:', (e && e.message) || e); }
  } catch (e) {
    log('LOGIN ERROR:', (e && e.message) || e);
  }
}
document.getElementById('go').addEventListener('click', doLogin);
</script>
</body>
</html>
